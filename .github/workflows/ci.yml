name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: test (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: angular
            app_path: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
            runtime: node
            node_version: "20"
          - app_name: java
            app_path: G-rez-l-int-gration-et-la-livraison-continue-Application-Java
            runtime: java
            java_version: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          cache: gradle

      - name: Run tests
        shell: bash
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh "${{ matrix.app_path }}" "${{ matrix.app_name }}"

      - name: Detect JUnit XML
        id: junit
        if: always()
        shell: bash
        run: |
          if find test-results -type f -name "*.xml" -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            find test-results -type f -name "*.xml" -print
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No JUnit XML files were generated."
          fi

      - name: Upload JUnit XML
        if: always() && steps.junit.outputs.found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.app_name }}
          path: test-results/**/*.xml
          if-no-files-found: warn

      - name: Publish test report
        if: always() && steps.junit.outputs.found == 'true'
        uses: dorny/test-reporter@v2
        with:
          name: Tests - ${{ matrix.app_name }}
          path: test-results/**/*.xml
          reporter: java-junit
          fail-on-empty: false

  build:
    name: build (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: angular
            app_path: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
            image_name: application-angular
          - app_name: java
            app_path: G-rez-l-int-gration-et-la-livraison-continue-Application-Java
            image_name: application-java

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+|-+$##g')"
          short_sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${{ matrix.image_name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "branch_sha=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app_path }}
          file: ${{ matrix.app_path }}/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.app_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app_name }}

  release:
    name: release (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app_name: angular
            release_config: release.angular.config.cjs
          - app_name: java
            release_config: release.java.config.cjs

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release tools
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git pull --ff-only origin main
          npx semantic-release --extends ./${{ matrix.release_config }}

name: Intégration continue

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  changes:
    name: Détecter les changements
    runs-on: ubuntu-latest
    outputs:
      angular: ${{ steps.filter.outputs.angular }}
      java: ${{ steps.filter.outputs.java }}
      any: ${{ steps.filter.outputs.any }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
      release_matrix: ${{ steps.filter.outputs.release_matrix }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Détecter les projets impactés
        id: filter
        shell: bash
        run: |
          # Détermine la base de comparaison selon le type d'événement.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed_files="run-tests.sh"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "$base" HEAD)"
          else
            base="${{ github.event.before }}"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            changed_files="$(git diff --name-only "$base" HEAD)"
          fi

          echo "$changed_files"

          angular=false
          java=false

          # Fichiers transverses: on force l'exécution Angular + Java.
          if echo "$changed_files" | grep -qE '^(run-tests\.sh|package\.json|package-lock\.json|release\..*\.config\.cjs|scripts/.*|\.github/workflows/ci\.yml)$'; then
            angular=true
            java=true
          fi

          # Changement dans le projet Angular uniquement.
          if echo "$changed_files" | grep -qE '^G-rez-l-int-gration-et-la-livraison-continue-Application-Angular/'; then
            angular=true
          fi

          # Changement dans le projet Java uniquement.
          if echo "$changed_files" | grep -qE '^G-rez-l-int-gration-et-la-livraison-continue-Application-Java/'; then
            java=true
          fi

          any=false
          if [[ "$angular" == "true" || "$java" == "true" ]]; then
            any=true
          fi

          test_entries=""
          build_entries=""
          release_entries=""

          if [[ "$angular" == "true" ]]; then
            test_entries='{"app_name":"angular","app_path":"G-rez-l-int-gration-et-la-livraison-continue-Application-Angular","runtime":"node","node_version":"20"}'
            build_entries='{"app_name":"angular","app_path":"G-rez-l-int-gration-et-la-livraison-continue-Application-Angular","image_name":"application-angular"}'
            release_entries='{"app_name":"angular","release_config":"release.angular.config.cjs"}'
          fi

          if [[ "$java" == "true" ]]; then
            test_entry='{"app_name":"java","app_path":"G-rez-l-int-gration-et-la-livraison-continue-Application-Java","runtime":"java","java_version":"21"}'
            build_entry='{"app_name":"java","app_path":"G-rez-l-int-gration-et-la-livraison-continue-Application-Java","image_name":"application-java"}'
            release_entry='{"app_name":"java","release_config":"release.java.config.cjs"}'

            test_entries="${test_entries:+$test_entries,}$test_entry"
            build_entries="${build_entries:+$build_entries,}$build_entry"
            release_entries="${release_entries:+$release_entries,}$release_entry"
          fi

          echo "angular=$angular" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "test_matrix={\"include\":[$test_entries]}" >> "$GITHUB_OUTPUT"
          echo "build_matrix={\"include\":[$build_entries]}" >> "$GITHUB_OUTPUT"
          echo "release_matrix={\"include\":[$release_entries]}" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

      - name: Installer Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          cache: gradle

      - name: Exécuter les tests
        shell: bash
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh "${{ matrix.app_path }}" "${{ matrix.app_name }}"

      - name: Détecter les rapports JUnit XML
        id: junit
        if: always()
        shell: bash
        run: |
          if find test-results -type f -name "*.xml" -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            find test-results -type f -name "*.xml" -print
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Aucun fichier JUnit XML n'a été généré."
          fi

      - name: Publier l'artefact JUnit XML
        if: always() && steps.junit.outputs.found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.app_name }}
          path: test-results/**/*.xml
          if-no-files-found: warn

      - name: Publier le rapport de tests
        if: always() && steps.junit.outputs.found == 'true'
        uses: dorny/test-reporter@v2
        with:
          name: Résultats tests - ${{ matrix.app_name }}
          path: test-results/**/*.xml
          reporter: java-junit
          fail-on-empty: false

  build:
    name: Build image (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Préparer les métadonnées image
        id: meta
        shell: bash
        run: |
          # Nommage normalisé pour des tags Docker lisibles et stables.
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+|-+$##g')"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${{ matrix.app_name }}" == "angular" ]]; then
            version="$(node -p "require('./${{ matrix.app_path }}/package.json').version")"
          else
            version="$(grep -m1 -E "^version\\s*=\\s*['\\\"][^'\\\"]+['\\\"]" "${{ matrix.app_path }}/build.gradle" | sed -E "s/^version\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]$/\\1/")"
          fi
          image="ghcr.io/${owner}/${{ matrix.image_name }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "branch_sha=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version_snapshot_sha=${version}-snapshot-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app_path }}
          file: ${{ matrix.app_path }}/Dockerfile
          # Les images sont poussées sur push/workflow_dispatch.
          # Le tag snapshot est non stable; le tag versionné est réservé à la release.
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_snapshot_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.app_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app_name }}

  release:
    name: Release (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: [changes, test, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.changes.outputs.release_matrix) }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer les outils de release
        run: npm ci

      - name: Exécuter semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # semantic-release crée le commit de version, pousse sur main et crée le tag Git.
          git checkout main
          git pull --ff-only origin main
          npx semantic-release --extends ./${{ matrix.release_config }}
